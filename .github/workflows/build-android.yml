name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Setup Gradle wrapper
        run: |
          # Generate gradle-wrapper.jar using pre-installed Gradle on the runner
          cd android
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating gradle-wrapper.jar via gradle wrapper command..."
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x gradlew
          ls -la gradle/wrapper/
          cd ..

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/remote-control.apk
          ls -la release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-control-apk
          path: release/remote-control.apk
          retention-days: 30
